<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Production Portfolio | Johnson Production</title>
    <link rel="stylesheet" href="../../assets/css/vendors/bootstrap.min.css" />
    <link rel="stylesheet" href="../../assets/fonts/remixicon/remixicon.css" />
    <link rel="stylesheet" href="../../assets/fonts/satoshi/satoshi.css" />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link rel="stylesheet" href="../../assets/css/portfolio-gallery.css" />
</head>
<body class="portfolio-gallery-page" data-category="post-production">
    <main class="portfolio-gallery-shell">
        <section class="section-work pt-120 pb-150">
            <div class="portfolio-gallery-heading text-center">
                <div class="portfolio-gallery-heading-actions d-flex justify-content-center">
                    <a href="../../index-1RR.html#portfolio" class="btn btn-gradient text-uppercase">Back</a>
                </div>
                <h1 data-category-name class="portfolio-category-title">Post Production</h1>
                <p data-category-description class="mt-3">Post Production portfolio images</p>
            </div>
            <div class="portfolio-work-carousel card-scroll">
                <div class="cards" id="work-slides" tabindex="0" aria-label="Post Production portfolio slideshow"></div>
                <div class="portfolio-gallery-controls d-flex justify-content-center align-items-center gap-3 mt-4">
                    <button class="btn btn-gradient" type="button" id="previous-slide" aria-label="Previous image" disabled>Previous</button>
                    <span id="slide-count" aria-live="polite">0 / 0</span>
                    <button class="btn btn-gradient" type="button" id="next-slide" aria-label="Next image" disabled>Next</button>
                </div>
            </div>
            <nav class="portfolio-gallery-nav mt-5" aria-label="Portfolio categories"></nav>
        </section>
    </main>
    <script src="../../assets/js/portfolio-gallery.js"></script>
</body>
</html>
